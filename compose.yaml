services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID}"
      GITHUB_APP_PRIVATE_KEY_PATH: "/run/secrets/opsreplay/github-app-private-key.pem"
    volumes:
      - ./.secrets:/run/secrets/opsreplay:ro
    depends_on:
      db:
        condition: service_healthy

  webhook_ingress:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - /app/.venv/bin/fastapi
      - run
      - app/webhook_main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    profiles:
      - webhook
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:17-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: opsreplay_test
      POSTGRES_USER: opsreplay_test
      POSTGRES_PASSWORD: opsreplay_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
