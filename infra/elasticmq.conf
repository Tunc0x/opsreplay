include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

queues {
  opsreplay-webhooks {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    fifo = false
  }
}

aws {
  region = us-east-1
  accountId = "000000000000"
}
